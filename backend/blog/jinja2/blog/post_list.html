{% extends 'main.jinja2.html' %}

{% block title %}
  {{ title }}
{% endblock title %}

{% block body %}
  {% for i_post in post_list %}
    <img src="{{ i_post.picture.url }}" alt="{{ i_post.title }}" width="150">
    <strong>{{ i_post.title }}</strong>
    <p class="font-serif text-3xl font-bold underline text-indigo-500">{{ i_post.annotation }}</p>
    <small>{{ i_post.created_at }}</small>
    <hr>
    <span>{{ i_post.section.title }}</span>
    <hr>
    <a href="{{ i_post.get_absolute_url() }}">Читать</a>
  {% endfor %}
{% endblock body %}
