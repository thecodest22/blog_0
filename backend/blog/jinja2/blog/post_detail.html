{% extends 'main.jinja2.html' %}

{% block title %}
  {{ title }}
{% endblock title %}

{% block body %}
  <img src="{{ post.picture.url }}" alt="{{ post.title }}" width="250">
  <strong>{{ post.title }}</strong>
  <p>{{ post.content }}</p>
  <small>{{ post.created_at }}</small>
  <hr>
  <span>{{ post.section.title }}</span>
  <a href="{{ url('blog:post_list') }}">Назад к списку постов</a>
{% endblock body %}
