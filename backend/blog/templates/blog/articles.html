{% extends 'main.html' %}

{% block content %}
  {% for i_post in posts %}
    <img
      src="{{ i_post.picture.url }}"
      alt="{{ i_post.title }}"
      width="150"
    >
    <strong>{{ i_post.title }}</strong>
    <p>{{ i_post.annotation }}</p>
    <small>{{ i_post.created_at }}</small>
    <hr>
    <span>{{ i_post.section.title }}</span>
  {% endfor %}

{% endblock content %}
