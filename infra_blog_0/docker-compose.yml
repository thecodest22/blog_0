name: blog0

services:
  db:
    # По настройке БД:
    # https://postgrespro.ru/docs/postgresql/9.4/runtime-config-resource
    # https://postgrespro.ru/docs/postgresql/9.6/performance-tips
    # https://habr.com/ru/articles/578744/
    # https://highload.guide/blog/query_performance_postgreSQL.html
    image: postgres:16.1-alpine3.19
    container_name: blog0-db
    restart: unless-stopped
    networks:
      - postgres
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./temp/db_dumps:/home/dumps
      - db_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      start_interval: 3s
      retries: 2
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 4G
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4
    container_name: blog0-pgadmin
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    networks:
      - postgres
    ports:
      - "5050:80"
    volumes:
      - ./temp/pgadmin_dumps:/var/tmp
      - pg_admin_data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    env_file:
      - .env

